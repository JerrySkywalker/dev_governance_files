name: Governance Contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-contract:
    name: Portable Harness and Agent contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Checkout mismatch: expected=$env:EXPECTED_SHA actual=$actual"
          }
          "EXACT_HEAD=$actual"

      - name: Set up Python for JSON Schema validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          check-latest: false

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'

      - name: Validate machine-readable contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          pairs = [
              (Path('config/repo-health-harness-v1.json'), Path('config/schemas/repo-health-harness-v1.schema.json')),
              (Path('.agent/context-manifest-v1.json'), Path('.agent/context-manifest-v1.schema.json')),
              (Path('config/windows-dev-directory-manifest-v1.json'), Path('config/schemas/windows-dev-directory-manifest-v1.schema.json')),
          ]
          for document_path, schema_path in pairs:
              document = json.loads(document_path.read_text(encoding='utf-8'))
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(document)
              print(f'SCHEMA_PASS={document_path}')
          standalone_schemas = [
              Path('tools/repo-health/schemas/protected-a5-finalization-authorization.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-finalization-authorization-v2.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-finalization-evidence.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-finalization-receipt.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-legacy-governance-provenance.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-legacy-compatibility-preparation.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-legacy-goal-companion.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-legacy-budget-companion.schema.json'),
              Path('tools/repo-health/schemas/protected-a5-legacy-lease-compatibility.schema.json'),
              Path('tools/repo-health/schemas/jpc-053j-protected-scope-closure-authorization.schema.json'),
              Path('tools/repo-health/schemas/jpc-053j-protected-scope-closure-receipt.schema.json'),
          ]
          for schema_path in standalone_schemas:
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              print(f'SCHEMA_DEFINITION_PASS={schema_path}')
          PY

      - name: Run Harness contract
        shell: pwsh
        run: ./tests/repo-health/Test-RepoHealthHarnessContract.ps1

      - name: Run portable scope-separation contract
        shell: pwsh
        run: ./tests/repo-health/Test-DevelopmentProductionScope.ps1

      - name: Run 054D protected-scope closure contract
        shell: pwsh
        run: ./tests/repo-health/Test-Jpc054DProtectedScopeClosure.ps1

      - name: Run protected A5 governance finalizer contract
        shell: pwsh
        run: ./tests/repo-health/Test-ProtectedA5GovernanceFinalizer.ps1

      - name: Run protected A5 legacy compatibility contract
        shell: pwsh
        run: ./tests/repo-health/Test-ProtectedA5LegacyCompatibility.ps1

      - name: Run Agent-context contract
        shell: pwsh
        run: ./tests/repo-health/Test-AgentContextContract.ps1

      - name: Run Writer Ownership V2 contract
        shell: pwsh
        run: ./tests/repo-health/Test-WriterOwnershipV2.ps1

      - name: Run Windows development bootstrap contract
        shell: pwsh
        run: ./tests/windows-dev/Test-WindowsDevBootstrap.ps1

      - name: Dry-run merged branch health cleanup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/repo-health/Invoke-MergedBranchCleanup.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -Token $env:GH_TOKEN

  windows-exact-closeout:
    name: Windows exact closeout and Writer Lease v1 contracts
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Checkout mismatch: expected=$env:EXPECTED_SHA actual=$actual"
          }
          "EXACT_HEAD=$actual"

      - name: Run exact 053J protected-scope closure contract
        shell: pwsh
        run: ./tests/repo-health/Test-Jpc053JProtectedScopeClosure.ps1

      - name: Run 054D protected-scope closure regression
        shell: pwsh
        run: ./tests/repo-health/Test-Jpc054DProtectedScopeClosure.ps1

      - name: Run Writer Lease v1 settlement and scope-cardinality contracts
        shell: pwsh
        run: ./tests/repo-health/Test-WriterLeaseV1Settlement.ps1
